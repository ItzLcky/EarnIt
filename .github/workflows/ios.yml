name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, needs no secrets: proves the code compiles for a real iOS device.
  compile:
    name: Compile (unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project EarnIt.xcodeproj \
            -scheme EarnIt \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          # grep hides the noise; check the real result:
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

  # Runs once you've added the signing secrets (see SETUP.md).
  # Produces EarnIt.ipa you can install on your registered iPhone from Linux.
  device-build:
    name: Signed build for iPhone
    needs: compile
    if: vars.TEAM_ID != ''
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ vars.TEAM_ID }}
      KEYCHAIN: ci-signing.keychain-db
      KEYCHAIN_PASSWORD: ${{ github.run_id }}-keychain
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEV_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import cert.p12 -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm cert.p12
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey.p8

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          # -allowProvisioningUpdates + API key lets Xcode register the bundle IDs,
          # enable capabilities (Family Controls, App Groups) and make provisioning profiles.
          xcodebuild archive \
            -project EarnIt.xcodeproj \
            -scheme EarnIt \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/EarnIt.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            | tee build/archive.log | grep -E "error:|BUILD|ARCHIVE" || true
          test -d build/EarnIt.xcarchive

      - name: Export .ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/__TEAM_ID__/$TEAM_ID/" ci/ExportOptions-development.plist > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/EarnIt.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/export

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: EarnIt-ipa
          path: build/export/*.ipa
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signing-logs
          path: build/*.log
          if-no-files-found: ignore

      - name: Clean up keychain & key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -rf ~/private_keys
